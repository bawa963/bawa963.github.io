<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAMERA HEALTHCARE LTD Games</title>
<meta name="description" content="Mobile games published by TAMERA HEALTHCARE LTD, including Honk Out, a car parking puzzle for Android.">
<style>
  :root { --bg: #f6f3ea; --ink: #15181e; --muted: #4c5566; --green: #0f7150; --card: #ffffff; --rule: rgba(21, 24, 30, 0.12); }
  @media (prefers-color-scheme: dark) { :root { --bg: #141820; --ink: #f6f3ea; --muted: #a9b3c4; --green: #86edb9; --card: #1d222c; --rule: rgba(246, 243, 234, 0.14); } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 .25rem; }
  .meta { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--green); }
  .game { display: flex; gap: 1rem; align-items: flex-start; background: var(--card); border: 1px solid var(--rule); border-radius: 18px; padding: 1rem; }
  .game img { width: 88px; height: 88px; border-radius: 20px; flex: none; }
  .game h2 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .game p { margin: 0 0 .5rem; }
  .links { display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
<h1>TAMERA HEALTHCARE LTD</h1>
<p class="meta">Games for Android.</p>

<section class="game">
<img src="honk-out/icon.png" alt="Honk Out app icon">
<div>
<h2>Honk Out</h2>
<p>A car parking puzzle. Tap cars and buses out of a jammed lot and get every passenger a ride in a vehicle of their own colour.</p>
<div class="links">
<a href="honk-out/privacy-policy.html">Privacy policy</a>
</div>
</div>
</section>

<footer>
Contact: <a href="mailto:subramaniamnavan3@gmail.com">subramaniamnavan3@gmail.com</a><br>
© 2026 TAMERA HEALTHCARE LTD
</footer>
</main>
</body>
</html>
